# THIS FILE SETS UP THE APP SETTINGS FOR THE EVENTS TRACKER.
# THIS IS WHERE THE LOCAL DATABASE AND SERVER SETTINGS LIVE.
# WRITTEN BY LEWIS MCDONALD ON 2026-10-08.

spring.application.name=edinburgh-events-tracker

# Use the in-memory H2 database for local app startup and tests.
spring.datasource.url=jdbc:h2:mem:edinburgh-events;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
