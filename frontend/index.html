<!-- Purpose: Build the homepage for browsing, filtering, and creating Edinburgh events. -->
<!-- Language: HTML. -->
<!-- Author: Lewis McDonald. -->
<!-- Date: 2026-10-08. -->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edinburgh Events and Venues Tracker</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="topbar">
		<div class="brand-block">
			<p class="eyebrow">Edinburgh</p>
			<h1>Events and Venues Tracker</h1>
		</div>
		<button id="refreshButton" class="primary-button" type="button">Refresh events</button>
	</header>

	<main class="page-layout">
		<section class="panel left-panel">
			<h2>Find an event</h2>

			<div class="search-box">
				<label for="searchInput">Search by title or venue</label>
				<input id="searchInput" type="text" placeholder="Search the calendar...">
			</div>

			<div class="filter-row">
				<label for="categoryFilter">Category</label>
				<select id="categoryFilter">
					<option value="all">All categories</option>
					<option value="FESTIVAL">Festival</option>
					<option value="GIG">Gig</option>
					<option value="MEETUP">Meetup</option>
					<option value="FOOD">Food</option>
					<option value="SPORT">Sport</option>
					<option value="FAMILY">Family</option>
					<option value="ARTS">Arts</option>
				</select>
			</div>

			<div class="stats-grid">
				<div class="stat-box">
					<span class="stat-label">Total</span>
					<strong id="totalEvents">0</strong>
				</div>
				<div class="stat-box">
					<span class="stat-label">Upcoming</span>
					<strong id="upcomingEvents">0</strong>
				</div>
				<div class="stat-box">
					<span class="stat-label">Free</span>
					<strong id="freeEvents">0</strong>
				</div>
			</div>

			<div class="results-header">
				<h3>Results</h3>
			</div>
			<div id="eventsList" class="events-list" aria-live="polite"></div>
		</section>

		<aside class="panel right-panel">
			<h2>Add a new event</h2>

			<form id="eventForm" class="event-form">
				<label>
					Title
					<input type="text" name="title" required>
				</label>

				<label>
					Description
					<textarea name="description" rows="3" required></textarea>
				</label>

				<div class="two-column-row">
					<label>
						Category
						<select name="category" required>
							<option value="FESTIVAL">Festival</option>
							<option value="GIG">Gig</option>
							<option value="MEETUP">Meetup</option>
							<option value="FOOD">Food</option>
							<option value="SPORT">Sport</option>
							<option value="FAMILY">Family</option>
							<option value="ARTS">Arts</option>
						</select>
					</label>

					<label>
						Venue
						<input type="text" name="venueName" placeholder="The Queen's Hall" required>
					</label>
				</div>

				<div class="two-column-row">
					<label>
						Start date and time
						<input type="datetime-local" name="startDateTime" required>
					</label>

					<label>
						End date and time
						<input type="datetime-local" name="endDateTime" required>
					</label>
				</div>

				<div class="two-column-row">
					<label>
						Price
						<input type="number" name="price" min="0" step="0.01" value="0" required>
					</label>

					<label>
						Website link
						<input type="url" name="websiteUrl" placeholder="https://example.com" required>
					</label>
				</div>

				<button class="primary-button submit-button" type="submit">Create event</button>
			</form>

			<p id="formMessage" class="form-message" aria-live="polite"></p>
		</aside>
	</main>

	<script src="app.js"></script>
</body>
</html>
